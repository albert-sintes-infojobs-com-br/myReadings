services:
  db:
    image: postgres:16-alpine
    container_name: myreadings-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: myreadings
      POSTGRES_USER: myreadings
      POSTGRES_PASSWORD: myreadings
    ports:
      - "15432:5432"
    volumes:
      - db_data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myreadings -d myreadings"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DB_PROVIDER: postgresql
    container_name: myreadings-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DB_PROVIDER: postgresql
      DATABASE_URL: "postgresql://myreadings:myreadings@db:5432/myreadings?schema=public"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myreadings-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  db_data_postgres:
